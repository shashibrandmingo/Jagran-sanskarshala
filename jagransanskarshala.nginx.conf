# ================================================================
# Jagran Sanskarshala - Nginx Configuration
# VPS Par Copy Karo: /etc/nginx/sites-available/jagransanskarshala
# ================================================================
#
# PORTS:
#   Next.js Frontend  → port 3000
#   Express Backend   → port 8000
#
# Commands to apply:
#   sudo cp jagransanskarshala.nginx.conf /etc/nginx/sites-available/jagransanskarshala
#   sudo ln -s /etc/nginx/sites-available/jagransanskarshala /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ================================================================

server {
    listen 80;
    server_name jagransanskarshala.com www.jagransanskarshala.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jagransanskarshala.com www.jagransanskarshala.com;

    ssl_certificate     /etc/letsencrypt/live/jagransanskarshala.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jagransanskarshala.com/privkey.pem;

    client_max_body_size 16M;

    # ---------------------------------------------------------------
    # Next.js API routes jo Next.js server par hain (port 3000)
    # YE ROUTES Express backend par NAHI jaane chahiye
    # ---------------------------------------------------------------
    location /api/send-certificate {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/download-certificate {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------
    # Express Backend API routes (port 8000)
    # ---------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------
    # Baaki sab Next.js Frontend (port 3000)
    # ---------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
